[project]
name = "food-security-sandbox-farmer"
version = "1.0.0"
description = "Food Security Sandbox farmer server: datasets, privacy tooling, local training and risk analysis."
requires-python = ">=3.12,<3.13"
# Versions match the image deployed from year5_dev before the ICICLE CI/CD migration.
# scikit-learn stays on 1.6.1 so pca_model.pkl unpickles exactly as before.
dependencies = [
    "adversarial-robustness-toolbox==1.20.1",
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "keras==3.10.0",
    "numpy==2.0.2",
    "pandas==2.3.3",
    "pydantic-settings==2.11.0",
    "pymongo==4.17.0",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "scikit-learn==1.6.1",
    "scipy==1.13.1",
    "tensorflow==2.20.0",
]

[tool.uv]
package = false
